<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PersonalHub Capture · Options</title>
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body>
    <form class="options" id="form">
      <div class="row"><img src="/icons/48.png" width="28" height="28" alt="" style="border-radius: 7px" /><h1>PersonalHub Capture</h1></div>
      <p class="hint">Create a capture token in PersonalHub › Settings › Capture and paste it here. The token is stored only on this device.</p>
      <label class="f">Hub URL<input type="url" id="hubUrl" required placeholder="https://your-app.vercel.app" /></label>
      <label class="f">Capture token<input type="password" id="token" autocomplete="off" placeholder="ph_…" /></label>
      <label class="f">Default area<select id="area"><option value="">None (let rules decide)</option></select></label>
      <label class="row hint"><input type="checkbox" id="autoAi" /> Ask AI to organise by default</label>
      <div class="row"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="test">Test connection</button></div>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
